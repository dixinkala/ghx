<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GitHub 加速器</title>
<style>
:root{
  color-scheme: dark;
  --bg:#080b10; --card:#121821; --card2:#0d131b; --line:#1e2836;
  --fg:#e6edf3; --dim:#8b98a9; --acc:#2f81f7; --acc2:#38bdf8;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --input:#0a0f16; --track:#0a0f16; --sw-off:#26313f; --sw-knob:#8b98a9;
  --glow:rgba(47,129,247,.22);
  --btn:#1a2432; --shadow:0 6px 16px rgba(47,129,247,.25);
}
html[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f6f9; --card:#ffffff; --card2:#fbfcfe; --line:#dbe2ea;
  --fg:#1b2430; --dim:#65727f; --acc:#0969da; --acc2:#0aa2e8;
  --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e;
  --input:#f3f5f8; --track:#e7ecf2; --sw-off:#d3dae4; --sw-knob:#ffffff;
  --glow:rgba(9,105,218,.12);
  --btn:#f0f3f7; --shadow:0 8px 20px rgba(9,105,218,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
  font:15px/1.6 -apple-system,system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;
  background:radial-gradient(1200px 420px at 50% -180px, var(--glow), transparent 70%), var(--bg);
}
h1,h2{margin:0}
.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(145deg,#1f6feb,#0b3b63 70%);
  display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(47,129,247,.28), inset 0 1px 0 rgba(255,255,255,.18);
}
.mark svg{width:22px;height:22px}
.brand h1{font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--dim);white-space:nowrap}
.hero-right{display:flex;align-items:center;gap:8px;flex:none}
.ver{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;
  padding:2px 8px;white-space:nowrap}
#theme{width:36px;height:36px;min-height:36px;padding:0;border-radius:10px;
  display:grid;place-items:center;background:var(--btn);border:1px solid var(--line)}
#theme svg{width:18px;height:18px}

.card{background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.card h2{font-size:12.5px;font-weight:600;letter-spacing:.4px;color:var(--dim);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.status .label{font-size:12px;color:var(--dim)}
.status .value{font-size:22px;font-weight:650;margin-top:2px;letter-spacing:.3px}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim)}
.meta b{color:var(--fg);font-weight:600}
.stale{color:var(--warn);font-size:11.5px}

button{font:inherit;color:var(--fg);border:1px solid var(--line);background:var(--btn);
  border-radius:12px;padding:11px 16px;min-height:44px}
button:active{transform:scale(.985);opacity:.92}
button[disabled]{opacity:.45}
button.primary{border:0;color:#fff;font-weight:600;
  background:linear-gradient(135deg,#1f6feb,#38bdf8);box-shadow:var(--shadow)}
button.wide{width:100%;margin-top:2px}

input{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;min-height:44px;flex:1;min-width:0}
input::placeholder{color:var(--dim);opacity:.75}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}

.switch{
  width:62px;height:36px;border-radius:22px;padding:0;position:relative;flex:none;
  background:var(--sw-off);border:0;transition:background .2s ease, box-shadow .2s ease;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
}
.switch .knob{
  position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;
  background:#fff;display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.06);
  transition:left .22s cubic-bezier(.34,1.4,.64,1), transform .12s ease;
}
.switch:active .knob{transform:scale(.94)}
.switch svg{width:15px;height:15px;display:block}
.switch .pwr{stroke:#8b98a9}
.switch .spin{display:none;stroke:#1f6feb}
.switch.on{background:linear-gradient(135deg,#1f6feb,#38bdf8);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.18), 0 0 0 1px rgba(56,189,248,.35), 0 4px 14px rgba(47,129,247,.35)}
.switch.on .knob{left:30px}
.switch.on .pwr{stroke:#1f6feb}
.switch.connecting .pwr{display:none}
.switch.connecting .spin{display:block;animation:spin .9s linear infinite}
.switch[disabled]{opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
html[data-theme="light"] .switch{box-shadow:inset 0 1px 2px rgba(16,24,40,.12)}
html[data-theme="light"] .switch .knob{box-shadow:0 1px 4px rgba(16,24,40,.22)}
html[data-theme="light"] .switch .pwr{stroke:#7a8796}

.progress{height:7px;border-radius:6px;background:var(--track);border:1px solid var(--line);
  overflow:hidden;margin-top:12px;display:none}
.progress i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,#1f6feb,#38bdf8);transition:width .18s}
.hint{font-size:12px;color:var(--dim);margin-top:9px;line-height:1.55}
.err{font-size:12.5px;color:var(--bad);margin-top:8px;white-space:pre-wrap}

.list{margin-top:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.item:last-child{border-bottom:0}
.item .k{color:var(--fg)}
.item .v{color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.item .empty{color:var(--dim);font-size:12.5px}

.mirrors{margin-top:10px}
.mirror{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;padding:6px 0}
.mirror .name{font-size:12.5px;color:var(--fg)}
.mirror .spd{font-size:11.5px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.mirror .track{grid-column:1/-1;height:5px;border-radius:4px;background:var(--track);overflow:hidden}
.mirror .track i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#38bdf8);opacity:.9}

.notice{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;font-size:12.5px;
  background:rgba(47,129,247,.1);border:1px solid rgba(47,129,247,.35);color:var(--fg);line-height:1.55}
html[data-theme="light"] .notice{background:#eaf3fe;border-color:#b9d8fb}

.reader{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;
  max-height:54vh;overflow:auto;font-size:14px}
.reader h1,.reader h2,.reader h3{line-height:1.35;margin:14px 0 6px}
.reader h1{font-size:19px}.reader h2{font-size:17px}.reader h3{font-size:15px}
.reader pre{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px;
  overflow-x:auto;font-size:12px;line-height:1.45}
.reader code{background:var(--input);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.reader pre code{border:0;padding:0}
.reader a{color:var(--acc2);text-decoration:none;word-break:break-word}
.reader blockquote{margin:8px 0;padding:2px 10px;border-left:3px solid var(--line);color:var(--dim)}
.reader img{display:none}

footer{margin:22px 4px 0;font-size:11.5px;color:var(--dim);opacity:.85;line-height:1.7;text-align:center}
</style></head><body>

<header class="hero">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M13.5 3.5 6 13h5l-.5 7.5L18 11h-5l.5-7.5Z" fill="#EAF6FF"/>
      </svg>
    </div>
    <div><h1>GitHub 加速器</h1><p>原生运行 · 免 root · 国内网络</p></div>
  </div>
  <div class="hero-right">
    <span class="ver">2.15</span>
    <button id="theme" aria-label="切换主题"></button>
  </div>
</header>

<section class="card status">
  <div class="row between">
    <div>
      <div class="label">DNS 加速</div>
      <div class="value" id="vpnState">未开启</div>
    </div>
    <button class="switch" id="sw" aria-label="DNS 加速开关">
      <span class="knob">
        <svg class="pwr" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 3v8.5"/><path d="M6.3 6.4a8.2 8.2 0 1 0 11.4 0"/>
        </svg>
        <svg class="spin" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round">
          <path d="M12 4a8 8 0 1 1-7 4.2"/>
        </svg>
      </span>
    </button>
  </div>
  <div class="meta">
    <span>最佳节点 <b id="bestNode">未测速</b></span>
    <span id="resolved"></span>
  </div>
  <div class="hint" id="dnsHint">开启时会先自动优选 IP，只接管 github.com / api / codeload 三个域名的解析</div>
  <div class="notice" id="notice"></div>
</section>

<section class="card">
  <h2>加速下载</h2>
  <div class="row">
    <input id="dlUrl" placeholder="粘贴 GitHub 链接" autocomplete="off" spellcheck="false">
    <button class="primary" id="dlBtn">下载</button>
  </div>
  <div class="progress" id="bar"><i></i></div>
  <div class="hint" id="dlMsg">文件保存到「下载/ghx」</div>
</section>

<section class="card">
  <h2>优选 IP</h2>
  <button class="primary wide" id="ipBtn">开始测速优选</button>
  <div id="ips" class="list"></div>
  <div class="hint">开启 DNS 加速前先测一次，否则不会接管任何域名。</div>
</section>

<section class="card">
  <h2>只读浏览</h2>
  <div class="row">
    <input id="rdUrl" placeholder="github.com/owner/repo" autocomplete="off" spellcheck="false">
    <button id="rdBtn">打开</button>
  </div>
  <div class="err" id="rdErr"></div>
  <div class="reader" id="reader"></div>
</section>

<section class="card">
  <h2>镜像节点</h2>
  <button class="wide" id="mBtn">重新测速</button>
  <div class="mirrors" id="mirrors"></div>
</section>

<footer>
  下载与克隆走公开反代，仅用于公开内容<br>
  推送代码请用官方地址：git push github 分支
</footer>

<script>
const $ = s => document.querySelector(s);
let seq = 0; const pending = {};
let rdBusy = false;
let lastP = {done: 0, total: 0};

function call(action, payload) {
  return new Promise((resolve, reject) => {
    const id = 'c' + (++seq);
    pending[id] = {resolve, reject};
    try { Ghx.call(action, JSON.stringify(payload || {}), id); }
    catch (e) { reject(e); }
  });
}
window.__ghx = (id, obj) => {
  const p = pending[id]; delete pending[id];
  if (!p) return;
  if (obj && obj.error) p.reject(new Error(obj.error)); else p.resolve(obj || {});
};
window.__ghxProgress = (o) => {
  if (!o.total) return;
  lastP = {done: o.done, total: o.total};
  const pct = Math.min(100, o.done * 100 / o.total);
  const bar = $('#bar');
  bar.style.display = 'block';
  bar.firstElementChild.style.width = pct + '%';
  $('#dlMsg').textContent = `${fmt(o.done)} / ${fmt(o.total)} · ${Math.round(pct)}% · ${o.node || ''}`;
};
window.__ghxNote = (m) => { if (dlState === 'running') $('#dlMsg').textContent = m; };
window.__ghxNotice = (m) => {
  const n = $('#notice');
  n.textContent = m; n.style.display = 'block';
  clearTimeout(window.__nt);
  window.__nt = setTimeout(() => { n.style.display = 'none'; }, 9000);
};
window.__ghxRefresh = () => {
  if (dlState === 'idle') dlLabel();
  if (!rdBusy) { const b = $('#rdBtn'); b.disabled = false; b.textContent = '打开'; }
  refreshState();
};

function fmt(n) {
  if (n === undefined || n === null) return '?';
  const u = ['B','KB','MB','GB']; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(i ? 1 : 0) + u[i];
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- 下载：下载 / 暂停 / 继续 ---------- */
let dlState = 'idle';
let dlUrl = '';

function dlLabel() {
  const b = $('#dlBtn');
  b.disabled = false;
  b.textContent = dlState === 'running' ? '暂停' : (dlState === 'paused' ? '继续' : '下载');
}

async function startDownload() {
  const typed = $('#dlUrl').value.trim();
  const u = typed || dlUrl;
  if (!u) return;
  dlUrl = u;
  dlState = 'running';
  dlLabel();
  $('#bar').style.display = 'none';
  $('#dlMsg').textContent = '准备中…';
  try {
    const r = await call('download', {url: u});
    if (r && r.paused) {
      dlState = 'paused';
      dlLabel();
      $('#dlMsg').textContent = lastP.total
        ? `已暂停（${fmt(lastP.done)} / ${fmt(lastP.total)}），点「继续」接着下`
        : '已暂停，点「继续」接着下';
      return;
    }
    dlState = 'idle';
    dlLabel();
    $('#bar').style.display = 'block';
    $('#bar').firstElementChild.style.width = '100%';
    $('#dlMsg').textContent = `完成：${r.name}（${fmt(r.bytes)}）· 节点 ${r.node}`;
  } catch (e) {
    dlState = 'idle';
    dlLabel();
    $('#dlMsg').textContent = '失败：' + e.message;
  }
}

$('#dlBtn').onclick = async () => {
  if (dlState === 'running') {
    const b = $('#dlBtn');
    b.disabled = true;
    b.textContent = '暂停中…';
    try { await call('cancel'); } catch (e) { }
    return;
  }
  startDownload();
};

/* ---------- 状态 ---------- */
async function refreshState() {
  try {
    const s = await call('state');
    const on = !!s.vpn;
    if (!swBusy) setSw(on ? 'on' : 'off');
    if (s.mirrors && s.mirrors.length) showMirrors(s.mirrors);
    if (s.ips && Object.keys(s.ips).length) showIps(s.ips);
    const rs = $('#resolved');
    if (s.vpn && s.resolved) {
      rs.innerHTML = `解析 <b>github.com → ${esc(s.resolved)}</b>` +
        (s.resolvedStale ? ' <span class="stale">系统缓存，稍后生效</span>' : '');
    } else {
      rs.innerHTML = '';
    }
    // 开着时每 5 秒自动刷新，解析那行会自己更新过来
    clearTimeout(window.__st);
    if (s.vpn) window.__st = setTimeout(refreshState, 5000);
  } catch (e) { }
}

function showMirrors(list) {
  if (!list.length) { $('#mirrors').innerHTML = '<div class="hint">没有可用节点</div>'; return; }
  $('#bestNode').textContent = list[0].host;
  const max = Math.max.apply(null, list.map(m => m.kbps || 1));
  $('#mirrors').innerHTML = list.map(m => {
    const w = Math.max(6, Math.round((m.kbps / max) * 100));
    return `<div class="mirror">
      <span class="name">${esc(m.host)}</span>
      <span class="spd">${Math.round(m.kbps)} KB/s</span>
      <span class="track"><i style="width:${w}%"></i></span>
    </div>`;
  }).join('');
}

function showIps(ips) {
  const keys = Object.keys(ips);
  $('#ips').innerHTML = keys.length ? keys.map(h =>
    `<div class="item"><span class="k">${esc(h)}</span><span class="v">${esc(ips[h])}</span></div>`
  ).join('') : '';
}

$('#ipBtn').onclick = async () => {
  const b = $('#ipBtn'); b.disabled = true; b.textContent = '测速中…';
  try { const r = await call('ips'); showIps(r.ips || {}); }
  catch (e) { $('#ips').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
  finally { b.disabled = false; b.textContent = '开始测速优选'; }
};

$('#mBtn').onclick = async () => {
  const b = $('#mBtn'); b.disabled = true; b.textContent = '测速中…';
  try { const r = await call('mirrors'); showMirrors(r.mirrors || []); }
  catch (e) { $('#mirrors').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
  finally { b.disabled = false; b.textContent = '重新测速'; }
};

let swBusy = false;

function setSw(state) { // 'on' | 'off' | 'connecting'
  const sw = $('#sw');
  sw.classList.toggle('on', state === 'on');
  sw.classList.toggle('connecting', state === 'connecting');
  sw.disabled = state === 'connecting';
  const txt = state === 'connecting' ? '连接中…' : (state === 'on' ? '已开启' : '未开启');
  const v = $('#vpnState');
  v.textContent = txt;
  v.style.color = state === 'on' ? 'var(--ok)' : (state === 'connecting' ? 'var(--acc)' : 'var(--fg)');
}

async function waitVpn(want, ms) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    try {
      const s = await call('state');
      if (!!s.vpn === want) return true;
    } catch (e) { }
    await new Promise(r => setTimeout(r, 500));
  }
  return false;
}

$('#sw').onclick = async () => {
  if (swBusy) return;
  const turningOn = !$('#sw').classList.contains('on');
  swBusy = true;
  if (!turningOn) {
    setSw('off');
    try { await call('vpn', {on: false}); } catch (e) { }
    swBusy = false;
    refreshState();
    return;
  }
  setSw('connecting');
  try {
    // 没优选过就先自动优选，否则开了也不会接管任何域名
    const st = await call('state');
    if (!st.ips || !Object.keys(st.ips).length) {
      window.__ghxNotice('正在优选 IP，稍等…');
      try { const r = await call('ips'); showIps(r.ips || {}); } catch (e) { }
    }
    const r = await call('vpn', {on: true});
    const ok = await waitVpn(true, 12000);
    setSw(ok ? 'on' : 'off');
    if (!ok) {
      window.__ghxNotice(r.error ? ('VPN 未能开启：' + r.error)
        : 'VPN 未能开启：请在系统弹窗里点「确定」，或先关掉其他 VPN');
    } else {
      refreshState();
    }
  } catch (e) {
    setSw('off');
    window.__ghxNotice('开启失败：' + e.message);
  } finally {
    swBusy = false;
  }
};

/* ---------- 只读浏览 ---------- */
function md(t) {
  t = t.replace(/\r\n/g, '\n');
  const blocks = [];
  t = t.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, c) => {
    blocks.push('<pre>' + esc(c) + '</pre>'); return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  const out = []; let para = []; let list = false;
  const flush = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const closeList = () => { if (list) { out.push('</ul>'); list = false; } };
  for (const line of t.split('\n')) {
    const s = line.replace(/\s+$/, '');
    if (/^\u0000\d+\u0000$/.test(s)) { flush(); closeList(); out.push(s); continue; }
    let m = s.match(/^(#{1,6})\s+(.*)$/);
    if (m) { flush(); closeList(); const l = Math.min(m[1].length, 3);
      out.push('<h' + l + '>' + inline(m[2]) + '</h' + l + '>'); continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(s)) { flush(); closeList(); out.push('<hr>'); continue; }
    if (s.startsWith('>')) { flush(); closeList(); out.push('<blockquote>' + inline(s.replace(/^>\s?/, '')) + '</blockquote>'); continue; }
    m = s.match(/^\s*(?:[-*+]|\d+\.)\s+(.*)$/);
    if (m) { flush(); if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(m[1]) + '</li>'); continue; }
    if (!s.trim()) { flush(); closeList(); continue; }
    if (list) out.push('<li>' + inline(s) + '</li>'); else para.push(s);
  }
  flush(); closeList();
  let html = out.join('\n');
  blocks.forEach((b, i) => { html = html.split('\u0000' + i + '\u0000').join(b); });
  return html;
}
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<a href="$2">[图] $1</a>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s;
}

$('#rdBtn').onclick = async () => {
  const u = $('#rdUrl').value.trim();
  if (!u) return;
  $('#rdErr').textContent = ''; $('#reader').style.display = 'none';
  const btn = $('#rdBtn'); btn.disabled = true; btn.textContent = '…'; rdBusy = true;
  try {
    const r = await call('read', {url: u});
    $('#reader').innerHTML = /\.(md|markdown)$/i.test(r.name) ? md(r.text) : '<pre>' + esc(r.text) + '</pre>';
    $('#reader').style.display = 'block';
  } catch (e) { $('#rdErr').textContent = e.message; }
  finally { rdBusy = false; btn.disabled = false; btn.textContent = '打开'; }
};

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8.2 8.2 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5Z"/></svg>';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('ghx-theme', t); } catch (e) { }
  $('#theme').innerHTML = t === 'light' ? MOON : SUN;
}
applyTheme((() => {
  try { const s = localStorage.getItem('ghx-theme'); if (s) return s; } catch (e) { }
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
})());
$('#theme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

refreshState();
</script>
</body></html>
